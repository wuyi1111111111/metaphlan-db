name: download-humann-db

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download HUMAnN databases and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/humann
          cd /tmp/humann
          SEG=$((1900 * 1024 * 1024))
          gh release create humann-db --title "HUMAnN databases" -R wuyi1111111111/metaphlan-db 2>/dev/null || echo "release exists"
          # chocophlan
          echo "=== chocophlan ==="
          curl -sS -L --fail --retry 5 -o choco.tar.gz "https://huttenhower.sph.harvard.edu/humann_databases/chocophlan/full_chocophlan.v201901_v31.tar.gz"
          split -b 1900M -d choco.tar.gz choco_part_
          for f in choco_part_*; do echo "upload $f"; gh release upload humann-db $f --clobber -R wuyi1111111111/metaphlan-db; done
          rm -f choco.tar.gz choco_part_*
          # uniref90
          echo "=== uniref90 ==="
          curl -sS -L --fail --retry 5 -o uniref.tar.gz "https://huttenhower.sph.harvard.edu/humann_databases/uniref/uniref90_annotated_v201901b_full.tar.gz"
          split -b 1900M -d uniref.tar.gz uniref_part_
          for f in uniref_part_*; do echo "upload $f"; gh release upload humann-db $f --clobber -R wuyi1111111111/metaphlan-db; done
          rm -f uniref.tar.gz uniref_part_*
          # utility_mapping
          echo "=== utility_mapping ==="
          curl -sS -L --fail --retry 5 -o mapping.tar.gz "https://huttenhower.sph.harvard.edu/humann_databases/utility_mapping/full_mapping_v201901b.tar.gz"
          gh release upload humann-db mapping.tar.gz --clobber -R wuyi1111111111/metaphlan-db
          echo "ALL HUMANN DB DONE"