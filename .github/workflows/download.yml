name: download-humann-db

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mapping only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /tmp
          curl -sS -L --fail --retry 5 -o mapping.tar.gz "http://huttenhower.sph.harvard.edu/humann_data/full_mapping_v201901b.tar.gz"
          ls -la mapping.tar.gz
          gh release upload humann-db mapping.tar.gz --clobber -R wuyi1111111111/metaphlan-db
          echo "MAPPING DONE"